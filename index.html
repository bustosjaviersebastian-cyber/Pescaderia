<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PESCADOS</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0077B6"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(180deg,#90E0EF,#CAF0F8);min-height:100vh;color:#023047;padding-bottom:84px}
header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;text-align:center;font-size:1.6rem;font-weight:900;padding:14px;padding-top:max(14px,env(safe-area-inset-top))}
main{padding:12px;max-width:640px;margin:auto}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 3px 10px #0002}
h2{margin:0 0 8px;font-size:1.1rem}
input,select{width:100%;padding:11px;margin:4px 0;border:2px solid #90E0EF;border-radius:10px;font-size:1rem;background:#fff;color:#023047}
button{width:100%;padding:12px;margin:4px 0;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem}
button.ok,.btn2{background:#2A9D8F}button.x{width:auto;background:#E63946;padding:6px 12px;margin:0}
.btnl{background:#0077B6;color:#fff;padding:8px 14px;border-radius:10px;font-weight:800}
.fila{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #eee}
.tot{font-size:1.7rem;font-weight:900;text-align:center;margin:8px 0}
.pagar{background:linear-gradient(135deg,#FFB703,#FB8500);color:#fff;text-align:center;border-radius:18px;padding:16px;margin-bottom:12px;font-weight:900}.pagar b{display:block;font-size:2.6rem}.pagar button{background:#023047}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#023047;padding-bottom:env(safe-area-inset-bottom)}nav button{background:0;border-radius:0;margin:0;font-size:.68rem;padding:8px 2px;color:#90E0EF}nav button.on{color:#FFB703}nav span{display:block;font-size:1.3rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g2 label{font-size:.75rem;font-weight:700}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.g3 small{display:block;font-size:.7rem;opacity:.7}.g3 b{font-size:1rem}
.ph{height:120px;border-radius:12px;background:#CAF0F8;display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
.vac{text-align:center;opacity:.7}.err{color:#E63946;font-weight:700;text-align:center}
.dias{padding:2px 8px;border-radius:10px;color:#fff;font-weight:800;font-size:.75rem}.vd{background:#2A9D8F}.am{background:#FB8500}.rj{background:#E63946}
.cero{opacity:.7;border:2px dashed #E63946}.fecha{margin-top:6px;font-size:.85rem}
.chips{display:flex;gap:6px}.chips button{margin:2px 0;padding:9px 4px;background:#CAF0F8;color:#023047;font-size:.85rem}.chips button.on{background:#0077B6;color:#fff}
.bar{height:8px;border-radius:6px;background:#CAF0F8;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00B4D8,#FFB703)}
#mod{display:none;position:fixed;inset:0;z-index:50}.mbg{position:absolute;inset:0;background:#023047aa}
.mcard{position:absolute;left:0;right:0;bottom:0;top:max(24px,env(safe-area-inset-top));background:#CAF0F8;border-radius:20px 20px 0 0;overflow:auto;padding:14px;max-width:640px;margin:auto}
.mcard label{font-size:.8rem;font-weight:700;display:block}
.stk{display:flex;gap:8px;align-items:center}.stk button{width:60px;font-size:1.6rem;padding:6px;margin:0}.stk input{text-align:center;margin:0}
#imp{display:none}
.pag{position:relative;overflow:hidden;width:210mm;height:297mm;page-break-after:always;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;background:radial-gradient(circle at 15% 20%,#fff8 0 12mm,#0000 13mm),radial-gradient(circle at 85% 75%,#fff8 0 18mm,#0000 19mm),radial-gradient(circle at 80% 15%,#fff6 0 8mm,#0000 9mm),linear-gradient(180deg,#90E0EF,#CAF0F8 45%,#48CAE4)}
.pag h1{margin:0;font-size:22mm;text-align:center;color:#023047;text-shadow:0 1mm 0 #fff;padding:0 10mm;z-index:1}
.pag .foto{z-index:1;width:170mm;height:125mm;border-radius:10mm;border:2mm solid #fff;background:#fff8;display:flex;align-items:center;justify-content:center;font-size:80mm;overflow:hidden}.pag .foto img{width:100%;height:100%;object-fit:contain}
.pag .cartel{z-index:1;transform:rotate(-3deg);background:linear-gradient(135deg,#FFB703,#FB8500);border:2.5mm solid #fff;border-radius:14mm;padding:5mm 16mm;text-align:center;color:#fff;box-shadow:0 3mm 0 #023047}.cartel small{display:block;font-size:8mm;font-weight:800}.cartel b{display:block;font-size:34mm;line-height:1;text-shadow:0 1.5mm 0 #023047}.cartel span{font-size:9mm;font-weight:800}
.pag i{position:absolute;font-style:normal;font-size:60mm;opacity:.18}.w1{top:-5mm;left:-8mm;transform:rotate(-20deg)}.w2{bottom:-5mm;right:-8mm;transform:rotate(15deg)}
.ped{width:210mm;padding:15mm;color:#023047;font-family:system-ui,sans-serif}.ped h1{font-size:14mm;margin:0 0 6mm;display:flex;justify-content:space-between;align-items:baseline}.ped h1 small{font-size:7mm}.ped table{width:100%;border-collapse:collapse;font-size:7mm}.ped td,.ped th{border-bottom:.4mm solid #023047;padding:3mm 2mm;text-align:left}
@media print{@page{size:A4;margin:0}body{background:none;padding:0}#app{display:none}#imp{display:block}#mod{display:none!important}}
</style></head><body><div id="app"></div><div id="imp"></div><div id="mod"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// ===== CONFIGURACIÓN DE FIREBASE =====
const FIREBASE={apiKey:"AIzaSyAy-l50y8fd98MtWikaVOhivwIaij-76yg",authDomain:"pescaderia-bc75e.firebaseapp.com",projectId:"pescaderia-bc75e",storageBucket:"pescaderia-bc75e.firebasestorage.app",messagingSenderId:"104206673938",appId:"1:104206673938:web:ac4043747d69624531d0cb"};
// ==================================================
const fb=initializeApp(FIREBASE),auth=getAuth(fb),db=initializeFirestore(fb,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const $=id=>document.getElementById(id),A=window.A={};
const DEF={margen:35,gastos:5,amarillo:30,rojo:60};
const C=['productos','lotes','ventas','pagos'],S={productos:[],lotes:[],ventas:[],pagos:[],cfg:{...DEF}};
let user=null,view='v',cart=[],unsub=[],sel=new Set(),msg='',rk={p:'sem',m:'kg'},ped=new Set(),showCompra=false,q='',edId=null;
const f$=n=>(n||0).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const d=t=>new Date(t).toLocaleDateString('es-AR'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ymd=t=>{const x=new Date(t);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const prod=id=>S.productos.find(p=>p.id==id),put=(c,o)=>{setDoc(doc(db,c,o.id),o)},del=(c,id)=>{deleteDoc(doc(db,c,id))};
const kgDisp=id=>S.lotes.filter(l=>l.pid==id&&l.estado=='activo').reduce((a,l)=>a+l.kgRest,0);
const lotesAct=id=>S.lotes.filter(l=>l.pid==id&&l.estado=='activo'&&l.kgRest>0.001).sort((a,b)=>a.fecha-b.fecha);
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const dias=t=>Math.floor((Date.now()-t)/864e5),cls=n=>n>=S.cfg.rojo?'rj':n>=S.cfg.amarillo?'am':'vd';
const cod=n=>'P'+String(n).padStart(3,'0'),num=p=>parseInt(String(p.codigo||'').replace(/\D/g,''))||0;
const nextCode=()=>cod(Math.max(0,...S.productos.map(num))+1);
function asegurarCodigos(){const f=S.productos.filter(p=>!p.codigo).sort((a,b)=>a.id<b.id?-1:1);if(!f.length)return;let m=Math.max(0,...S.productos.map(num));f.forEach(p=>{p.codigo=cod(++m);put('productos',p)})}
const bal=t=>Math.max(0,Math.round(t=='gastos'?sum(S.ventas,v=>v.gastos||0)-sum(S.pagos.filter(p=>p.tipo=='gastos'),p=>p.monto):sum(S.ventas,v=>v.limpia||0)-sum(S.pagos.filter(p=>p.tipo!='gastos'),p=>p.monto)));

onAuthStateChanged(auth,u=>{user=u;unsub.forEach(f=>f());unsub=[];
 if(u){C.forEach(c=>unsub.push(onSnapshot(collection(db,c),s=>{S[c]=s.docs.map(x=>x.data());if(c=='productos')asegurarCodigos();render()},()=>{})));
 unsub.push(onSnapshot(doc(db,'ajustes','cfg'),s=>{if(s.exists())S.cfg={...DEF,...s.data()};render()},()=>{}))}
 render(true)});

const NAV=[['v','🛒','Vender'],['s','📦','Productos'],['g','🐷','Alcancía'],['r','🏆','Ranking'],['p','🏷️','Precios'],['a','⚙️','Ajustes']];
function render(force){
 const ae=document.activeElement;if(!force&&ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&$('app').contains(ae))return;
 if(!user){$('app').innerHTML=`<header>🐟 PESCADOS 🐟</header><main><div class=card><h2>Ingresar</h2><input id=em type=email placeholder="Correo"><input id=pw type=password placeholder="Contraseña"><button onclick="A.login()">Entrar</button><p class=err>${msg}</p></div></main>`;return}
 $('app').innerHTML=`<header>🐟 PESCADOS 🐟</header><main>${VW[view]()}</main><nav>${NAV.map(n=>`<button class="${view==n[0]?'on':''}" onclick="A.go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`}
A.go=v=>{view=v;render(true);scrollTo(0,0)};
A.login=()=>{msg='';signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value).catch(()=>{msg='Correo o contraseña incorrectos';render(true)})};

/* ---------- Listado de productos ---------- */
const LP=()=>{const t=q.trim().toLowerCase(),ps=S.productos.filter(p=>!t||(p.nombre+' '+(p.codigo||'')).toLowerCase().includes(t)).sort((a,b)=>(a.codigo||'').localeCompare(b.codigo||''));
 return ps.map(p=>{const ls=lotesAct(p.id),kg=sum(ls,l=>l.kgRest),u=S.lotes.filter(l=>l.pid==p.id).sort((a,b)=>b.fecha-a.fecha)[0],f=ls[0]?ls[0].fecha:(u?u.fecha:0);
 return `<div class="card ${kg<=0.001?'cero':''}"><div class=fila style="border:0;padding:0"><span><small>${esc(p.codigo||'')}</small><br><b style="font-size:1.1rem">${esc(p.nombre)}</b></span><button class=btnl style="width:auto" onclick="A.edit('${p.id}')">✏️ Editar</button></div>
 <div class=g3 style="margin-top:8px"><div><small>Stock</small><b>${kg.toFixed(2)} kg</b></div><div><small>Costo/kg</small><b>${f$(p.costoKg)}</b></div><div><small>Venta/kg</small><b>${f$(p.precio)}</b></div></div>
 <div class=fecha>${f?`📅 Compra ${d(f)} ${ls[0]?`<span class="dias ${cls(dias(f))}">${dias(f)} días</span>`:'· sin stock'}`:'Sin compras todavía'}</div></div>`}).join('')||'<p class=vac>No hay productos.</p>'};
const LOT=id=>lotesAct(id).map(l=>`<div class=fila><span>📅 <input type=date value="${ymd(l.fecha)}" style="width:auto;padding:6px" onchange="A.lfecha('${l.id}',this.value)"><br><small>${l.kgRest.toFixed(2)} kg · costo ${f$(l.costoKg)}/kg</small></span>${l.kgRest==l.kg?`<button class=x onclick="A.delLoteM('${l.id}')">✕</button>`:''}</div>`).join('')||'<p class=vac>Sin stock.</p>';

const VW={
v:()=>{const ps=S.productos.filter(p=>p.precio>0&&kgDisp(p.id)>0.001),tot=sum(cart,i=>i.kg*prod(i.pid).precio);
 return `<div class=card><h2>🛒 Carrito</h2>${ps.length?`<select id=cp>${ps.map(p=>`<option value="${p.id}">${esc(p.nombre)} · ${f$(p.precio)}/kg · ${kgDisp(p.id).toFixed(2)} kg</option>`).join('')}</select><input id=ck type=number step=0.01 inputmode=decimal placeholder="Kg a vender"><button onclick="A.add()">Agregar al carrito</button>`:'<p class=vac>Cargá stock y precios para poder vender.</p>'}
 ${cart.map((i,n)=>`<div class=fila><span>${esc(prod(i.pid).nombre)} · ${i.kg} kg</span><b>${f$(i.kg*prod(i.pid).precio)}</b><button class=x onclick="A.quit(${n})">✕</button></div>`).join('')}
 ${cart.length?`<div class=tot>Total ${f$(tot)}</div><button class=ok onclick="A.vender()">✅ Confirmar venta</button>`:''}</div>`},
s:()=>{const ac=S.lotes.filter(l=>l.estado=='activo'),vc=sum(ac,l=>l.kgRest*l.costoKg),vv=sum(ac,l=>{const p=prod(l.pid);return l.kgRest*(p?p.precio:0)});
 return `<div class=card><h2>📦 Productos</h2><div class=g2 style="text-align:center"><div><small>Stock a costo (capital)</small><br><b>${f$(vc)}</b></div><div><small>Stock a precio de venta</small><br><b>${f$(vv)}</b></div></div></div>
 <div class=card><button onclick="A.tcompra()">${showCompra?'▲ Cerrar carga de compra':'➕ Cargar compra'}</button>${showCompra?`<input id=sn list=dl placeholder="Producto (ej: Merluza)" autocomplete=off oninput="A.prev()"><datalist id=dl>${S.productos.map(p=>`<option value="${esc(p.nombre)}">`).join('')}</datalist><input id=sk type=number step=0.01 inputmode=decimal placeholder="Kg del bulto" oninput="A.prev()"><input id=sc type=number inputmode=decimal placeholder="Precio del bulto ($)" oninput="A.prev()"><div id=prev style="text-align:center;padding:6px 0"></div><button class=ok onclick="A.compra()">Agregar al stock</button>`:''}
 <button class=ok onclick="A.pedido()">📝 Faltantes / Pedido</button></div>
 <input id=bq placeholder="🔍 Buscar por código o nombre" value="${esc(q)}" oninput="A.buscar(this.value)"><div id=lp>${LP()}</div>`},
r:()=>{const t0={sem:7,mes:30,tot:0}[rk.p],vs=S.ventas.filter(v=>!t0||v.fecha>=Date.now()-t0*864e5),m={};
 vs.forEach(v=>v.items.forEach(i=>{const k=i.pid||i.n,o=m[k]=m[k]||{n:(prod(i.pid)||{nombre:i.n}).nombre,kg:0,lim:0};o.kg+=i.kg;o.lim+=i.lim}));
 const ar=Object.values(m).sort((a,b)=>rk.m=='kg'?b.kg-a.kg:b.lim-a.lim),mx=ar[0]?(rk.m=='kg'?ar[0].kg:ar[0].lim)||1:1,med=['🥇','🥈','🥉'];
 return `<div class=card><h2>🏆 Más vendidos</h2><div class=chips>${[['sem','7 días'],['mes','30 días'],['tot','Total']].map(x=>`<button class="${rk.p==x[0]?'on':''}" onclick="A.rk('p','${x[0]}')">${x[1]}</button>`).join('')}</div><div class=chips>${[['kg','Por kg'],['lim','Por ganancia']].map(x=>`<button class="${rk.m==x[0]?'on':''}" onclick="A.rk('m','${x[0]}')">${x[1]}</button>`).join('')}</div></div>
 <div class=card>${ar.map((o,n)=>`<div style="padding:7px 0;border-bottom:1px solid #eee"><div class=fila style="border:0;padding:0"><span>${med[n]||'<b>'+(n+1)+'.</b>'} <b>${esc(o.n)}</b></span><span style="text-align:right"><b>${o.kg.toFixed(1)} kg</b><br><small>${f$(o.lim)} ganancia</small></span></div><div class=bar><i style="width:${Math.max(3,Math.round((rk.m=='kg'?o.kg:o.lim)/mx*100))}%"></i></div></div>`).join('')||'<p class=vac>Sin ventas en este período.</p>'}</div>`},
p:()=>`<div class=card><h2>➕ Nuevo producto</h2><input id=np placeholder="Ej: Merluza"><button onclick="A.nuevo()">Agregar</button><button class=ok onclick="A.lista()">🖨️ Lista de precios (productos tildados)</button></div>`+S.productos.map(p=>`<div class=card><div class=ph>${p.img?`<img src="${p.img}">`:'🐟'}</div><div class=fila><label><input type=checkbox style="width:22px;height:22px" ${sel.has(p.id)?'checked':''} onchange="A.tog('${p.id}')"> En lista</label><label class=btnl>📷 Imagen<input type=file accept="image/*" hidden onchange="A.img('${p.id}',event)"></label><button class=x onclick="A.delp('${p.id}')">✕</button></div>
 <input value="${esc(p.nombre)}" onchange="A.ed('${p.id}','nombre',this.value)"><div class=g2><label>Costo/kg ($)<input type=number inputmode=decimal value="${p.costoKg?Math.round(p.costoKg*100)/100:''}" onchange="A.ed('${p.id}','costoKg',this.value)"></label><label>Margen (%)<input type=number inputmode=decimal value="${p.margen}" onchange="A.ed('${p.id}','margen',this.value)"></label><label>Gastos varios (%)<input type=number inputmode=decimal value="${p.gastos}" onchange="A.ed('${p.id}','gastos',this.value)"></label><label>Precio venta/kg ($)<input type=number inputmode=decimal value="${p.precio||''}" onchange="A.ed('${p.id}','precio',this.value)"></label></div></div>`).join(''),
g:()=>{const al=bal('limpia'),gg=bal('gastos');
 return `<div class=pagar>🐷 ALCANCÍA<b>${f$(al)}</b><button onclick="A.vaciar('limpia')">💰 Vaciar alcancía</button><button style="background:#0077B6" onclick="A.retirar('limpia')">Retirar un monto</button></div>
 <div class=card><div class=fila style="border:0"><span>🔧 Caja de gastos varios</span><b>${f$(gg)}</b></div><button class=ok onclick="A.vaciar('gastos')">Retirar gastos varios</button></div>
 <div class=card><h2>📋 Retiros realizados</h2>${[...S.pagos].sort((a,b)=>b.fecha-a.fecha).map(p=>`<div class=fila><span>${d(p.fecha)} · ${p.tipo=='gastos'?'🔧 Gastos varios':'🐷 Alcancía'}${p.lotes&&p.lotes.length?`<br><small>${p.lotes.map(l=>esc(l.n)).join(', ')}</small>`:''}</span><b>${f$(p.monto)}</b></div>`).join('')||'<p class=vac>Sin retiros todavía.</p>'}</div>
 <div class=card><h2>🧾 Ventas recientes</h2>${[...S.ventas].sort((a,b)=>b.fecha-a.fecha).slice(0,30).map(v=>`<div class=fila><span>${d(v.fecha)} · ${v.items.map(i=>esc(i.n)+' '+i.kg+'kg').join(', ')}</span><b>${f$(v.total)}</b></div>`).join('')||'<p class=vac>Sin ventas todavía.</p>'}</div>`},
a:()=>`<div class=card><h2>⚙️ Valores para productos nuevos</h2><label>Margen (%)<input type=number value="${S.cfg.margen}" onchange="A.cfg('margen',this.value)"></label><label>Gastos varios (% del costo)<input type=number value="${S.cfg.gastos}" onchange="A.cfg('gastos',this.value)"></label></div>
 <div class=card><h2>❄️ Alerta de días en freezer</h2><label>Amarillo desde (días)<input type=number value="${S.cfg.amarillo}" onchange="A.cfg('amarillo',this.value)"></label><label>Rojo desde (días)<input type=number value="${S.cfg.rojo}" onchange="A.cfg('rojo',this.value)"></label></div>
 <div class=card><h2>💾 Respaldo</h2><button onclick="A.exp()">📤 Guardar respaldo (.job)</button><label class="btnl btn2" style="display:block;text-align:center;margin-top:6px">📥 Cargar respaldo<input type=file hidden onchange="A.imp(event)"></label></div>
 <div class=card><p>${esc(user.email||'')}</p><button onclick="A.salir()">Cerrar sesión</button></div>`};

/* ---------- Venta ---------- */
A.add=()=>{const pid=$('cp').value,kg=parseFloat($('ck').value);if(!(kg>0))return;const en=sum(cart.filter(i=>i.pid==pid),i=>i.kg);
 if(kg+en>kgDisp(pid)+0.0001){alert('No hay tanto stock de ese producto.');return}
 const x=cart.find(i=>i.pid==pid);x?x.kg=Math.round((x.kg+kg)*1000)/1000:cart.push({pid,kg});render(true)};
A.quit=n=>{cart.splice(n,1);render(true)};
A.vender=()=>{if(!cart.length)return;const its=[];
 for(const it of cart){const p=prod(it.pid);let kg=it.kg;
  for(const l of S.lotes.filter(l=>l.pid==p.id&&l.estado=='activo').sort((a,b)=>a.fecha-b.fecha)){if(kg<=0.0001)break;
   const t=Math.min(kg,l.kgRest),costo=l.costoKg*t,sub=p.precio*t,gas=costo*(p.gastos/100),lim=sub-costo-gas;
   l.kgRest-=t;l.limpia=(l.limpia||0)+lim;l.gastos=(l.gastos||0)+gas;kg-=t;if(l.kgRest<0.001){l.kgRest=0;l.estado='agotado';l.pagado=true}
   put('lotes',l);its.push({pid:p.id,n:p.nombre,kg:t,precio:p.precio,sub,costo,gas,lim,lote:l.id})}}
 const v={id:uid(),fecha:Date.now(),items:its,total:sum(its,i=>i.sub),limpia:sum(its,i=>i.lim),gastos:sum(its,i=>i.gas)};put('ventas',v);cart=[];render(true);
 alert(`✅ Venta ${f$(v.total)}\n🐷 A la alcancía: ${f$(v.limpia)}\nGastos varios: ${f$(v.gastos)}`)};

/* ---------- Compras y productos ---------- */
A.tcompra=()=>{showCompra=!showCompra;render(true)};
A.buscar=v=>{q=v;$('lp').innerHTML=LP()};
A.prev=()=>{const e=$('prev');if(!e)return;const kg=parseFloat($('sk').value),c=parseFloat($('sc').value),n=$('sn').value.trim().toLowerCase(),p=S.productos.find(x=>x.nombre.toLowerCase()==n),mg=p?p.margen:S.cfg.margen;
 e.innerHTML=kg>0&&c>0?`Costo por kg: <b>${f$(c/kg)}</b><br>Precio de venta por kg: <b>${f$(Math.round(c/kg*(1+mg/100)))}</b> <small>(margen ${mg}%)</small>`:''};
A.compra=()=>{const n=$('sn').value.trim(),kg=parseFloat($('sk').value),c=parseFloat($('sc').value);if(!n||!(kg>0)||!(c>0)){alert('Completá producto, kg y precio del bulto.');return}
 let p=S.productos.find(x=>x.nombre.toLowerCase()==n.toLowerCase());
 if(!p)p={id:uid(),codigo:nextCode(),nombre:n,margen:S.cfg.margen,gastos:S.cfg.gastos,costoKg:0,precio:0,img:''};
 put('lotes',{id:uid(),pid:p.id,n:p.nombre,fecha:Date.now(),kg,kgRest:kg,costo:c,costoKg:c/kg,limpia:0,gastos:0,estado:'activo',pagado:true});
 p.costoKg=c/kg;p.precio=Math.round(p.costoKg*(1+p.margen/100));put('productos',p);showCompra=false;render(true);
 alert(`✅ ${p.nombre} cargado\nCosto por kg: ${f$(p.costoKg)}\nPrecio de venta por kg: ${f$(p.precio)}`)};
A.nuevo=()=>{const n=$('np').value.trim();if(!n)return;put('productos',{id:uid(),codigo:nextCode(),nombre:n,margen:S.cfg.margen,gastos:S.cfg.gastos,costoKg:0,precio:0,img:''});render(true)};
A.ed=(id,k,v)=>{const p=prod(id);if(k=='nombre')p.nombre=v.trim()||p.nombre;else{v=parseFloat(v)||0;p[k]=v;
 if(k=='costoKg'||k=='margen')p.precio=Math.round(p.costoKg*(1+p.margen/100));
 if(k=='precio'&&p.costoKg>0)p.margen=Math.round((v/p.costoKg-1)*1000)/10}
 put('productos',p);render(true)};
A.delp=id=>{if(confirm('¿Borrar este producto?'))del('productos',id)};

/* ---------- Tarjeta de edición ---------- */
const refMod=()=>{if(!edId)return;const e=$('e_st');if(e)e.textContent=kgDisp(edId).toFixed(2)+' kg';const l=$('e_l');if(l)l.innerHTML=LOT(edId)};
A.cerrar=()=>{edId=null;$('mod').style.display='none';$('mod').innerHTML=''};
A.edit=id=>{const p=prod(id);if(!p)return;edId=id;
 $('mod').innerHTML=`<div class=mbg onclick="A.cerrar()"></div><div class=mcard><div class=fila style="border:0"><h2 style="margin:0">✏️ Editar producto</h2><button class=x onclick="A.cerrar()">✕</button></div>
 <div class=card><label>Código<input id=e_c value="${esc(p.codigo||'')}"></label><label>Producto<input id=e_n value="${esc(p.nombre)}"></label>
 <div class=g2><label>Costo/kg ($)<input id=e_k type=number inputmode=decimal value="${p.costoKg?Math.round(p.costoKg*100)/100:''}"></label><label>Margen (%)<input id=e_m type=number inputmode=decimal value="${p.margen}"></label><label>Gastos varios (%)<input id=e_g type=number inputmode=decimal value="${p.gastos}"></label><label>Precio venta/kg ($)<input id=e_p type=number inputmode=decimal value="${p.precio||''}"></label></div></div>
 <div class=card><h2>📦 Stock: <b id=e_st>${kgDisp(id).toFixed(2)} kg</b></h2><div class=stk><button class=x onclick="A.stock('${id}',-1)">−</button><input id=e_d type=number step=0.5 inputmode=decimal value=1><button class=ok onclick="A.stock('${id}',1)">+</button></div><small>Indicá los kg y tocá + o −. Sirve para correcciones o merma; no afecta la alcancía.</small><div id=e_l style="margin-top:6px">${LOT(id)}</div></div>
 <button class=ok onclick="A.guardar()">💾 Guardar cambios</button><button class=x style="width:100%;padding:12px;margin-top:6px" onclick="A.delpm('${id}')">🗑️ Borrar producto</button></div>`;
 $('mod').style.display='block'};
A.stock=(id,sg)=>{const p=prod(id),n=parseFloat($('e_d').value);if(!p||!(n>0))return;
 if(sg>0){const ls=lotesAct(id),l=ls[ls.length-1];
  if(l){l.kg+=n;l.kgRest+=n;l.costo+=l.costoKg*n;put('lotes',l)}
  else{const ck=p.costoKg||0;put('lotes',{id:uid(),pid:id,n:p.nombre,fecha:Date.now(),kg:n,kgRest:n,costo:ck*n,costoKg:ck,limpia:0,gastos:0,estado:'activo',pagado:true})}}
 else{let rem=n;for(const l of lotesAct(id)){if(rem<=0.0001)break;const t=Math.min(rem,l.kgRest);l.kgRest-=t;rem-=t;if(l.kgRest<0.001){l.kgRest=0;l.estado='agotado';l.pagado=true}put('lotes',l)}
  if(rem>0.001)alert('Solo había stock para restar '+(n-rem).toFixed(2)+' kg.')}
 setTimeout(()=>{refMod();render(true)},50)};
A.lfecha=(id,v)=>{const l=S.lotes.find(x=>x.id==id);if(!l||!v)return;l.fecha=new Date(v+'T12:00:00').getTime();put('lotes',l);render(true)};
A.delLoteM=id=>{if(confirm('¿Borrar este lote? (solo para corregir un error de carga)')){del('lotes',id);S.lotes=S.lotes.filter(l=>l.id!=id);refMod();render(true)}};
A.guardar=()=>{const p=prod(edId);if(!p)return;
 const cd=$('e_c').value.trim().toUpperCase(),n=$('e_n').value.trim(),c=parseFloat($('e_k').value)||0,m=parseFloat($('e_m').value)||0,g=parseFloat($('e_g').value)||0,pr=parseFloat($('e_p').value)||0;
 if(!n){alert('Poné un nombre.');return}
 if(cd&&S.productos.some(x=>x.id!=p.id&&(x.codigo||'').toUpperCase()==cd)){alert('Ese código ya existe.');return}
 const cam=Math.abs(c-(p.costoKg||0))>0.011||m!=p.margen;
 if(cam){p.costoKg=c;p.margen=m;p.precio=Math.round(c*(1+m/100))}
 else if(pr!=p.precio){p.precio=pr;if(p.costoKg>0)p.margen=Math.round((pr/p.costoKg-1)*1000)/10}
 p.gastos=g;if(cd)p.codigo=cd;
 if(n!=p.nombre){p.nombre=n;S.lotes.filter(l=>l.pid==p.id).forEach(l=>{l.n=n;put('lotes',l)})}
 put('productos',p);A.cerrar();render(true)};
A.delpm=id=>{if(!confirm('¿Borrar este producto y su stock? Las ventas ya hechas se conservan.'))return;S.lotes.filter(l=>l.pid==id).forEach(l=>del('lotes',l.id));del('productos',id);S.productos=S.productos.filter(p=>p.id!=id);A.cerrar();render(true)};

/* ---------- Pedido / faltantes ---------- */
function pedUI(){const ps=[...S.productos].sort((a,b)=>((kgDisp(a.id)>0.001)-(kgDisp(b.id)>0.001))||a.nombre.localeCompare(b.nombre));
 $('mod').innerHTML=`<div class=mbg onclick="A.cerrar()"></div><div class=mcard><h2>📝 Pedido de mercadería</h2><p style="margin:0 0 6px;font-size:.85rem">Tildá lo que querés pedir. Los que están en 0 vienen tildados.</p><div class=chips><button onclick="A.pset('cero')">Solo en 0</button><button onclick="A.pset('todos')">Todos</button><button onclick="A.pset('ninguno')">Ninguno</button></div>
 <div class=card style="margin-top:8px">${ps.map(p=>{const k=kgDisp(p.id);return `<label class=fila style="font-size:1rem"><span><input type=checkbox style="width:22px;height:22px;vertical-align:middle" ${ped.has(p.id)?'checked':''} onchange="A.ptog('${p.id}')"> ${esc(p.nombre)}</span><b style="color:${k<=0.001?'#E63946':'#2A9D8F'}">${k<=0.001?'SIN STOCK':k.toFixed(1)+' kg'}</b></label>`}).join('')||'<p class=vac>No hay productos.</p>'}</div>
 <button onclick="A.pcomp()">📤 Compartir / copiar (WhatsApp)</button><button class=ok onclick="A.pimp()">🖨️ Imprimir / PDF</button><button class=x style="width:100%;padding:12px" onclick="A.cerrar()">Cerrar</button></div>`;$('mod').style.display='block'}
const pl=()=>S.productos.filter(p=>ped.has(p.id)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
A.pedido=()=>{edId=null;ped=new Set(S.productos.filter(p=>kgDisp(p.id)<=0.001).map(p=>p.id));pedUI()};
A.pset=m=>{ped=new Set(S.productos.filter(p=>m=='todos'||(m=='cero'&&kgDisp(p.id)<=0.001)).map(p=>p.id));pedUI()};
A.ptog=id=>{ped.has(id)?ped.delete(id):ped.add(id)};
A.pcomp=()=>{const ps=pl();if(!ps.length){alert('Tildá al menos un producto.');return}
 const t=`🐟 PEDIDO ${d(Date.now())}\n`+ps.map(p=>`• ${p.nombre}`).join('\n');
 if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('📋 Pedido copiado'));else prompt('Copiá el pedido:',t)};
A.pimp=()=>{const ps=pl();if(!ps.length){alert('Tildá al menos un producto.');return}
 $('imp').innerHTML=`<section class=ped><h1><span>🐟 PEDIDO</span><small>${d(Date.now())}</small></h1><table><tr><th>Cód.</th><th>Producto</th><th>Stock</th><th>Cantidad</th></tr>${ps.map(p=>`<tr><td>${esc(p.codigo||'')}</td><td><b>${esc(p.nombre)}</b></td><td>${kgDisp(p.id).toFixed(1)} kg</td><td style="width:35mm"></td></tr>`).join('')}</table></section>`;setTimeout(()=>print(),300)};

/* ---------- Lista de precios (sin cambios) ---------- */
A.tog=id=>{sel.has(id)?sel.delete(id):sel.add(id)};
A.img=(id,e)=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const p=prod(id);p.img=c.toDataURL('image/jpeg',.72);put('productos',p);render(true)};im.src=URL.createObjectURL(f)};
A.lista=()=>{const ps=[...sel].map(prod).filter(Boolean);if(!ps.length){alert('Tildá los productos que querés en la lista.');return}
 $('imp').innerHTML=ps.map(p=>`<section class=pag><i class=w1>🐟</i><i class=w2>🐠</i><h1>${esc(p.nombre)}</h1><div class=foto>${p.img?`<img src="${p.img}">`:'🐟'}</div><div class=cartel><small>PRECIO</small><b>${f$(p.precio)}</b><span>por kg</span></div></section>`).join('');setTimeout(()=>print(),300)};

/* ---------- Alcancía ---------- */
const ret=(tipo,monto)=>{put('pagos',{id:uid(),fecha:Date.now(),monto,tipo,lotes:[]});render(true)};
A.vaciar=tipo=>{const m=bal(tipo);if(m<=0){alert('No hay nada para retirar.');return}
 if(confirm(`¿${tipo=='gastos'?'Retirar la caja de gastos varios':'Vaciar la alcancía'}: ${f$(m)}?`))ret(tipo,m)};
A.retirar=tipo=>{const m=bal(tipo);if(m<=0){alert('No hay nada para retirar.');return}
 const v=parseFloat(String(prompt(`¿Cuánto retirás? (máximo ${f$(m)})`,m)||'').replace(',','.'));if(!(v>0))return;
 if(v>m+0.5){alert('Es más de lo que hay en la alcancía.');return}ret(tipo,v)};
A.rk=(k,v)=>{rk[k]=v;render(true)};

/* ---------- Ajustes y respaldo ---------- */
A.cfg=(k,v)=>{S.cfg[k]=parseFloat(v)||0;setDoc(doc(db,'ajustes','cfg'),S.cfg)};
A.exp=()=>{const o={v:2,productos:S.productos,lotes:S.lotes,ventas:S.ventas,pagos:S.pagos,cfg:S.cfg},n='pescados_respaldo_'+new Date().toISOString().slice(0,10)+'.job',f=new File([JSON.stringify(o)],n,{type:'application/octet-stream'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n;a.click()};
A.imp=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.productos))throw 0;
 if(!confirm('Se cargan los datos del respaldo (reemplazan los que tengan el mismo código). ¿Seguir?'))return;
 const ops=[];C.forEach(c=>(o[c]||[]).forEach(x=>ops.push([c,x])));for(let i=0;i<ops.length;i+=400){const b=writeBatch(db);ops.slice(i,i+400).forEach(([c,x])=>b.set(doc(db,c,x.id),x));await b.commit()}
 if(o.cfg)setDoc(doc(db,'ajustes','cfg'),o.cfg);alert('✅ Respaldo cargado')}catch(_){alert('El archivo no es un respaldo válido de PESCADOS.')}};r.readAsText(f)};
A.salir=()=>signOut(auth);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
